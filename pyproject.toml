[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ltx-reference-restorer"
version = "0.1.0"
description = "Local source-led film restoration, reproducible rendering, and human review"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "httpx>=0.28,<1", "pillow>=11,<13", "psutil>=6,<8"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
restorer = "restorer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/restorer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
